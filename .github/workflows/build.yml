name: Build and Package

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-debs:
    name: Build .deb packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts lintian

      - name: Build binary packages
        run: dpkg-buildpackage --no-sign -us -uc --build=binary

      - name: Run lintian
        run: |
          lintian --fail-on error \
            ../nvmesh-client-dkms_*.deb \
            ../nvmesh-target-dkms_*.deb

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: |
            ../nvmesh-client-dkms_*.deb
            ../nvmesh-target-dkms_*.deb
          retention-days: 7

  build-modules:
    name: Build kernel modules (${{ matrix.os }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            image: ubuntu:22.04
          - os: ubuntu-24.04
            image: ubuntu:24.04
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential python3 \
            linux-headers-generic \
            kmod

      - name: Build client kernel modules
        run: |
          KERN_VER=$(ls /lib/modules | head -1)
          make IM_CLIENT=1 \
               KERN_VER="${KERN_VER}" \
               OFED_VER_STRING=none \
               dkms

      - name: Check modules were produced
        run: |
          echo "=== Client modules ==="
          find common keeper clnt -name '*.ko' | sort
          test -f common/nvmeib_common.ko
          test -f keeper/nvmeib_keeper.ko
          test -f clnt/atom/nvmeiba.ko
          test -f clnt/nvmeibc.ko

      - name: Clean between builds
        run: make clean 2>/dev/null || true

      - name: Build target kernel modules
        run: |
          KERN_VER=$(ls /lib/modules | head -1)
          make IM_SERVER=1 \
               KERN_VER="${KERN_VER}" \
               OFED_VER_STRING=none \
               dkms

      - name: Check modules were produced
        run: |
          echo "=== Target modules ==="
          find common keeper srv -name '*.ko' | sort
          test -f common/nvmeib_common.ko
          test -f keeper/nvmeib_keeper.ko
          test -f srv/nvmeibs.ko

  build-client-rpm:
    name: Build client RPM (Rocky Linux 9)
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed so git describe can find the version tag
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          dnf install -y \
            gcc make python3 git \
            kernel-devel rpmdevtools rpm-build \
            rsync tree kmod

      - name: Detect installed kernel headers version
        run: |
          KERN_VER=$(ls /usr/src/kernels | head -1)
          echo "KERN_VER=${KERN_VER}" >> $GITHUB_ENV
          echo "KSRC=/usr/src/kernels/${KERN_VER}" >> $GITHUB_ENV

      - name: Build full client tree (modules + userspace tools)
        run: |
          make IM_CLIENT=1 \
               KERN_VER="${KERN_VER}" \
               _KSRC="${KSRC}" \
               OFED_VER_STRING=none \
               VERBOSE=false \
               all

      - name: Stub dist/pytools (populated by a separate pipeline in production)
        run: mkdir -p dist/pytools

      - name: Build client RPM
        run: |
          KERN_VER="${KERN_VER}" \
          OFED_VER_STRING=none \
          ./mk_client_rpm "${KERN_VER}" none

      - name: Verify RPMs were produced
        run: |
          echo "=== Produced RPMs ==="
          ls -lh nvmesh-*.rpm
          test -n "$(ls nvmesh-client-*.rpm 2>/dev/null)"
          test -n "$(ls nvmesh-base-*.rpm   2>/dev/null)"

      - name: Upload client RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages-client
          path: nvmesh-*.rpm
          retention-days: 7

  build-target-rpm:
    name: Build target RPM (Rocky Linux 9)
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable EPEL and High Availability repos
        run: |
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled highavailability

      - name: Add Confluent repo for librdkafka
        run: |
          rpm --import https://packages.confluent.io/rpm/7.6/archive.key
          cat > /etc/yum.repos.d/confluent.repo << 'EOF'
          [Confluent]
          name=Confluent repository
          baseurl=https://packages.confluent.io/rpm/7.6
          gpgcheck=1
          gpgkey=https://packages.confluent.io/rpm/7.6/archive.key
          enabled=1
          EOF

      - name: Install build dependencies
        run: |
          dnf install -y \
            gcc make python3 git \
            kernel-devel rpmdevtools rpm-build \
            rsync tree kmod \
            systemd-devel bzip2-devel \
            rdma-core-devel \
            librdkafka-devel \
            corosync-devel

      - name: Detect installed kernel headers version
        run: |
          KERN_VER=$(ls /usr/src/kernels | head -1)
          echo "KERN_VER=${KERN_VER}" >> $GITHUB_ENV
          echo "KSRC=/usr/src/kernels/${KERN_VER}" >> $GITHUB_ENV

      - name: Build full target tree (modules + TOMA + userspace tools)
        run: |
          make IM_SERVER=1 \
               KERN_VER="${KERN_VER}" \
               _KSRC="${KSRC}" \
               OFED_VER_STRING=none \
               VERBOSE=false \
               all

      - name: Build target RPM
        run: |
          KERN_VER="${KERN_VER}" \
          OFED_VER_STRING=none \
          ./mk_target_rpm "${KERN_VER}" none

      - name: Verify RPM was produced
        run: |
          echo "=== Produced RPMs ==="
          ls -lh nvmesh-*.rpm
          test -n "$(ls nvmesh-target-*.rpm 2>/dev/null)"

      - name: Upload target RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages-target
          path: nvmesh-target-*.rpm
          retention-days: 7
